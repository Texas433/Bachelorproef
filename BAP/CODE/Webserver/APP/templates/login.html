{% extends 'layout.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post" style="display: flex; flex-direction: column; max-width: 300px; margin: auto;">
    <input type="text" name="username" placeholder="Username" required style="margin-bottom: 10px; padding: 10px;">
    <input type="password" name="password" placeholder="Password" required style="margin-bottom: 10px; padding: 10px;">
    <button type="submit" style="padding: 10px; background-color: #3a7bd5; border: none; color: white; cursor: pointer;">Login</button>
</form>
{% endblock %}
